                    {lin.children.length > 0 && <span style={{ fontSize: 10, color: "var(--dim)" }}>→ {lin.children.map((c) => <button key={c.id} onClick={() => setSelId(c.id)} style={{ background: "none", border: "none", color: "var(--accent)", fontSize: 10, cursor: "pointer", padding: 0, textDecoration: "underline" }}>{c.title}</button>)}</span>}
                  </>); })()}
                </>
              )}
            </div>

            {/* Tabs */}
            <div style={{ display: "flex", borderBottom: "1px solid var(--border)", padding: "0 24px" }}>
              {[{ key: "output", label: `Generated${(sel.outputImages || []).length > 1 ? ` (${sel.outputImages.length})` : ""}` }, { key: "ref", label: "Reference" }, { key: "prompt", label: "Prompt" }, { key: "notes", label: "Notes" }].map((t) => {
                const active = tab === t.key;
                return <button key={t.key} onClick={() => setTab(t.key)} style={{ background: "none", border: "none", borderBottom: active ? "2px solid var(--accent)" : "2px solid transparent", color: active ? "var(--text2)" : "var(--dim)", padding: "10px 14px", fontSize: 13, cursor: "pointer", fontWeight: active ? 600 : 400, marginBottom: -1 }}>{t.label}</button>;
              })}
            </div>

            {/* Content */}
            <div style={{ flex: 1, overflow: "auto" }}>
              {tab === "output" && (
                <div style={{ padding: 24, background: "var(--bg2)", minHeight: "100%" }}>
                  {editing ? (
                    <MultiImageUpload images={editForm.outputImages || []} onChange={(imgs) => setEditForm((f) => ({ ...f, outputImages: imgs }))} />
                  ) : (sel.outputImages || []).length > 0 ? (
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
                      {sel.outputImages.map((img, idx) => (
                        <div key={idx} style={{ textAlign: "center" }}>
                          <LazyImage imageId={img.imageId} thumb={img.thumb} style={{ maxWidth: "100%", maxHeight: "60vh", objectFit: "contain", borderRadius: 6, cursor: "zoom-in" }} onClick={async () => { const full = await loadImage(img.imageId); if (full) setZoomImg(full); }} />
                          {img.filename && <div style={{ marginTop: 4, fontSize: 11, color: "var(--dim)", fontFamily: "var(--mono)" }}>{img.filename}</div>}
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div style={{ textAlign: "center", color: "var(--dimmer)", paddingTop: 48 }}>No images attached</div>
                  )}
                </div>
              )}
              {tab === "ref" && (
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100%", padding: 24, background: "var(--bg2)" }}>
                  {editing ? (
                    <ImageUpload label="" value={editForm.refImageId ? { imageId: editForm.refImageId, thumb: editForm.refThumb } : null} filename={editForm.refFilename || ""} onChangeImage={(v) => setEditForm((f) => ({ ...f, refImageId: v?.imageId || null, refThumb: v?.thumb || null }))} onChangeFilename={(v) => setEditForm((f) => ({ ...f, refFilename: v }))} />
                  ) : sel.refImageId ? (
                    <>
                      <LazyImage imageId={sel.refImageId} thumb={sel.refThumb} style={{ maxWidth: "100%", maxHeight: "70vh", objectFit: "contain", borderRadius: 6, cursor: "zoom-in" }} onClick={async () => { const full = await loadImage(sel.refImageId); if (full) setZoomImg(full); }} />
                      {sel.refFilename && <span style={{ marginTop: 8, fontSize: 11, color: "var(--dim)", fontFamily: "var(--mono)" }}>{sel.refFilename}</span>}
                    </>
                  ) : (
                    <span style={{ color: "var(--dimmer)" }}>No reference image</span>
                  )}
                </div>
              )}
              {tab === "prompt" && (
                <div style={{ padding: 24 }}>
                  <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
                    {!editing && <button onClick={() => copyPrompt(sel.prompt)} style={{ background: "none", border: "1px solid var(--border2)", borderRadius: 4, color: "var(--dim)", padding: "3px 10px", fontSize: 11, cursor: "pointer" }}>Copy</button>}
                  </div>
                  {editing ? (
                    <textarea value={editForm.prompt} onChange={(e) => setEditForm((f) => ({ ...f, prompt: e.target.value }))} style={{ width: "100%", minHeight: 300, background: "var(--input-bg)", border: "1px solid var(--border2)", borderRadius: 4, padding: 12, color: "var(--muted)", fontFamily: "var(--mono)", fontSize: 12.5, lineHeight: 1.7, outline: "none", resize: "vertical", boxSizing: "border-box" }} />
                  ) : (
                    <PromptView text={sel.prompt} highlights={sel.highlights || []} onUpdateHighlights={(hl) => updateHighlights(sel.id, hl)} />
                  )}
                </div>
              )}
              {tab === "notes" && (
                <div style={{ padding: 24 }}>
                  {editing ? (
                    <textarea value={editForm.notes || ""} onChange={(e) => setEditForm((f) => ({ ...f, notes: e.target.value }))} placeholder="Add notes — observations, what worked, what didn't…" style={{ width: "100%", minHeight: 200, background: "var(--input-bg)", border: "1px solid var(--border2)", borderRadius: 4, padding: 12, color: "var(--text)", fontSize: 13, lineHeight: 1.6, outline: "none", resize: "vertical", boxSizing: "border-box" }} />
                  ) : sel.notes ? (
                    <div style={{ fontSize: 13, lineHeight: 1.6, color: "var(--muted)", whiteSpace: "pre-wrap" }}>{sel.notes}</div>
                  ) : (
                    <div style={{ color: "var(--dimmer)", fontSize: 13 }}>No notes. Click Edit to add.</div>
                  )}
                </div>
              )}
            </div>
          </>
        ) : showForm ? (
          <div style={{ flex: 1, overflow: "auto", padding: "24px 32px" }}>
            <div style={{ maxWidth: 700 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
                <span style={{ fontSize: 17, fontWeight: 600, color: "var(--text2)" }}>New Entry</span>
                <button onClick={() => setShowForm(false)} style={{ background: "none", border: "1px solid var(--border2)", borderRadius: 4, color: "var(--muted)", padding: "4px 14px", fontSize: 13, cursor: "pointer" }}>Cancel</button>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div>
                  <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>Title (optional)</label>
                  <input value={form.title} onChange={(e) => setForm((f) => ({ ...f, title: e.target.value }))} style={inputStyle} />
                </div>
                <div style={{ display: "flex", gap: 12 }}>
                  <div style={{ flex: 1 }}>
                    <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>Model</label>
                    <input value={form.model} onChange={(e) => setForm((f) => ({ ...f, model: e.target.value }))} placeholder="e.g. Grok, Flux" style={inputStyle} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>Image date</label>
                    <input value={form.imageDate || ""} onChange={(e) => setForm((f) => ({ ...f, imageDate: e.target.value }))} placeholder="e.g. 2026-08-12" style={inputStyle} />
                  </div>
                  {folders.length > 0 && (
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>Folder</label>
                      <select value={form.folder || ""} onChange={(e) => setForm((f) => ({ ...f, folder: e.target.value }))} style={inputStyle}>
                        <option value="">No folder</option>
                        {folders.map((fld) => <option key={fld.id} value={fld.name}>{fld.name}</option>)}
                      </select>
                    </div>
                  )}
                </div>
                <div>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                    <label style={{ fontSize: 12, color: "var(--muted)" }}>Prompt</label>
                    {templates.length > 0 && <button onClick={() => setShowTemplates(!showTemplates)} style={{ background: "none", border: "none", color: "var(--accent)", fontSize: 11, cursor: "pointer", padding: 0 }}>Load template</button>}
                  </div>
                  {showTemplates && templates.length > 0 && (
                    <div style={{ background: "var(--input-bg)", borderRadius: 4, padding: 8, marginBottom: 8 }}>
                      {templates.map((tp) => (
                        <div key={tp.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "4px 0" }}>
                          <button onClick={() => { setForm((f) => ({ ...f, prompt: tp.template })); setShowTemplates(false); }} style={{ background: "none", border: "none", color: "var(--accent)", fontSize: 12, cursor: "pointer", padding: 0 }}>{tp.name}</button>
                          <button onClick={() => deleteTemplate(tp.id)} style={{ background: "none", border: "none", color: "var(--danger)", fontSize: 11, cursor: "pointer" }}>×</button>
                        </div>
                      ))}
                    </div>
                  )}
                  <textarea value={form.prompt} onChange={(e) => setForm((f) => ({ ...f, prompt: e.target.value }))} placeholder="Paste prompt text…" rows={10} style={{ ...inputStyle, fontFamily: "var(--mono)", fontSize: 12, resize: "vertical" }} />
                </div>
                <div>
                  <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>Notes (optional)</label>
                  <textarea value={form.notes || ""} onChange={(e) => setForm((f) => ({ ...f, notes: e.target.value }))} placeholder="Observations, what worked, what didn't…" rows={3} style={{ ...inputStyle, fontSize: 12, resize: "vertical" }} />
                </div>
                <div style={{ display: "flex", gap: 20 }}>
                  <div style={{ flex: 1 }}>
                    <MultiImageUpload images={form.outputImages || []} onChange={(imgs) => setForm((f) => ({ ...f, outputImages: imgs }))} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <ImageUpload label="Reference image (optional)" value={form.refImageId ? { imageId: form.refImageId, thumb: form.refThumb } : null} filename={form.refFilename} onChangeImage={(v) => setForm((f) => ({ ...f, refImageId: v?.imageId || null, refThumb: v?.thumb || null }))} onChangeFilename={(v) => setForm((f) => ({ ...f, refFilename: v }))} />
                  </div>
                </div>
                <div>
                  <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>Tags</label>
                  <TagInput tags={form.tags} onChange={(t) => setForm((f) => ({ ...f, tags: t }))} tagColors={tagColors} />
                </div>
                <button onClick={addEntry} disabled={!form.prompt.trim()} style={{ background: form.prompt.trim() ? "var(--accent)" : "var(--input-bg)", color: form.prompt.trim() ? "#fff" : "var(--dimmer)", border: "none", borderRadius: 4, padding: "10px 0", fontSize: 14, fontWeight: 500, cursor: form.prompt.trim() ? "pointer" : "default", marginTop: 8 }}>Save Entry</button>
              </div>
            </div>
          </div>
        ) : (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", color: "var(--dimmer)", gap: 8 }}>
            <span style={{ fontSize: 15 }}>Select an entry or create a new one</span>
            <span style={{ fontSize: 11 }}>↑↓ navigate · ⌘E edit · Esc cancel</span>
          </div>
        )}
      </div>
    </div>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(PromptCatalog));
</script>
</body>
</html>
